name: Upload Python Package

# Runs on the release tag pushed by release.yaml. A tag push runs with the
# tag as its ref, which the pypi environment allows and which checks out the
# version-bumped commit. workflow_dispatch on main is kept for manual recovery.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: pypi

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install build tools
      run: pip install build

    - name: Build sdist and wheel
      run: python -m build

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
